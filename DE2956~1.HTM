<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Défi 3.7 - Simulateur ChatGPT Canvas</title>
<style>
    :root {
    --bg-sidebar: #0d0d0d;
    --bg-main: #171717;
    --bg-panel: #2f2f2f;
    --bg-hover: #252525;
    --bg-active: #3a3a3a;
    --bg-user: #2f2f2f;
    --text-main: #ececec;
    --text-muted: #b4b4b4;
    --text-darker: #8e8e8e;
    --accent: #ffbf00;
    --guide-blue: #06065b;
    --guide-yellow: #ffbf00;
    --guide-cream: #FFF8E1;
    --font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
    html, body { margin: 0; padding: 0; background: transparent; }
    body { font-family: var(--font-family); }
    .chatgpt-simulator-wrapper {
        text-align: left;
        background: var(--bg-main);
        color: var(--text-main);
        display: flex;
        width: 100vw !important;
        max-width: 100vw !important;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        height: 80vh;
        min-height: 650px;
        max-height: 920px;
        overflow: hidden;
        margin: 0;
    }
    .chatgpt-simulator-wrapper * { box-sizing: border-box; margin: 0; padding: 0; }
    .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .icon.fill { fill: currentColor; stroke: none; }

    /* Sidebar */
    .sidebar {
        width: 260px;
        background: var(--bg-sidebar);
        display: flex;
        flex-direction: column;
        padding: 10px;
        flex-shrink: 0;
        z-index: 10;
    }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin-bottom: 18px; }
    .logo-area { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.2px; }
    .chatgpt-mark { width: 24px; height: 24px; color: #fff; }
    .icon-btn, .new-chat-btn, .menu-item, .recent-item { cursor: pointer; border: 0; background: transparent; color: var(--text-muted); font-family: var(--font-family); transition: .18s ease; }
    .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; }
    .icon-btn:hover, .menu-item:hover, .recent-item:hover { background: var(--bg-hover); color: var(--text-main); }
    .new-chat-btn { width: 100%; padding: 10px 14px; border-radius: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-size: 14px; font-weight: 500; text-align: left; background: var(--bg-hover); color: #fff; }
    .new-chat-btn:hover { background: var(--bg-active); }
    .menu-list, .sidebar-bottom { display: flex; flex-direction: column; gap: 2px; }
    .menu-item { padding: 10px 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; }
    .section-title { font-size: 11px; color: var(--text-darker); font-weight: 700; text-transform: uppercase; margin: 24px 0 8px 12px; letter-spacing: .5px; }
    .recent-item { padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-bottom { margin-top: auto; }
    .profile-area { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; cursor: pointer; transition: .18s ease; }
    .profile-area:hover { background: var(--bg-hover); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #f17; color: white; display: grid; place-items: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }
    .profile-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .profile-name { font-size: 14px; color: #fff; font-weight: 500; }
    .profile-location { font-size: 12px; color: var(--text-muted); }

    /* Main */
    .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--bg-main);
        position: relative;
        overflow: hidden;
        transition: padding-right .4s ease;
    }
    .main-area.split-layout { padding-right: 460px; }
    .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; z-index: 20; pointer-events: none; }
    .model-title { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; color: #fff; font-weight: 600; font-size: 15px; border-radius: 10px; padding: 7px 10px; cursor: pointer; }
    .model-title:hover { background: var(--bg-hover); }
    .top-actions { display: flex; gap: 8px; pointer-events: auto; }
    .top-action { color: var(--text-muted); border: 1px solid #383838; background: rgba(23,23,23,.5); border-radius: 999px; padding: 7px 11px; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .top-action:hover { background: var(--bg-hover); color: var(--text-main); }

    .chat-container {
        width: 100%;
        max-width: 820px;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 72px 20px 20px;
        overflow-y: auto;
        scroll-behavior: smooth;
        scrollbar-color: #444 transparent;
        scrollbar-width: thin;
    }
    .chat-container::-webkit-scrollbar, .guide-content::-webkit-scrollbar, .prompt-input::-webkit-scrollbar, .thumbnail-strip::-webkit-scrollbar { width: 8px; height: 8px; }
    .chat-container::-webkit-scrollbar-thumb, .prompt-input::-webkit-scrollbar-thumb { background: #444; border-radius: 999px; }
    .guide-content::-webkit-scrollbar-thumb, .thumbnail-strip::-webkit-scrollbar-thumb { background: var(--guide-yellow); border-radius: 999px; }
    .greeting-wrapper { display: none; }
    .chat-message { width: 100%; margin-bottom: 28px; animation: fadeIn .28s ease both; }
    .chat-message.user { display: flex; justify-content: flex-end; }
    .user-bubble { max-width: 82%; padding: 13px 17px; border-radius: 20px 20px 5px 20px; background: var(--bg-user); color: var(--text-main); font-size: 15.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .assistant-row { display: flex; align-items: flex-start; gap: 15px; max-width: 100%; }
    .assistant-avatar { width: 34px; height: 34px; border: 1px solid #474747; border-radius: 50%; display: grid; place-items: center; color: #d7d7d7; flex: 0 0 auto; }
    .assistant-avatar svg { width: 21px; height: 21px; }
    .message-content { min-width: 0; flex: 1; font-size: 16px; line-height: 1.62; color: var(--text-main); }
    .message-content p { margin: 0 0 12px; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content strong { color: #fff; }
    .thinking-pill { display: inline-flex; align-items: center; gap: 9px; min-height: 36px; padding: 7px 12px; border: 1px solid #3c3c3c; border-radius: 11px; color: var(--accent); background: rgba(30,30,30,.75); font-size: 14px; }
    .thinking-dots { display: inline-flex; gap: 4px; }
    .thinking-dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: dotPulse 1.05s infinite ease-in-out; }
    .thinking-dots i:nth-child(2) { animation-delay: .13s; }
    .thinking-dots i:nth-child(3) { animation-delay: .26s; }

    /* Attachments */
    .input-wrapper { position: relative; width: 100%; max-width: 820px; flex: 0 0 auto; padding: 0 20px 26px; }
    .file-tray { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .file-tray.hidden, .hidden { display: none !important; }
    .file-card {
        width: 116px;
        min-height: 102px;
        padding: 10px;
        border-radius: 22px;
        background: #1d1d1d;
        border: 1px solid #282828;
        color: #f1f1f1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        box-shadow: 0 1px 2px rgba(0,0,0,.2);
        user-select: none;
    }
    .file-card.compact { width: 108px; min-height: 88px; border-radius: 18px; gap: 10px; }
    .file-type { font-size: 13px; color: #d4d4d4; }
    .file-name { font-size: 14px; line-height: 1.23; font-weight: 650; overflow-wrap: anywhere; }
    .message-files { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .message-files .file-card { background: #222; border-color: #353535; }

    /* Composer */
    .input-box {
        width: 100%;
        min-height: 68px;
        padding: 13px 16px;
        border-radius: 30px;
        background: var(--bg-panel);
        border: 1px solid transparent;
        display: flex;
        align-items: flex-end;
        gap: 11px;
        box-shadow: 0 4px 24px rgba(0,0,0,.2);
        transition: border-color .2s, box-shadow .2s;
    }
    .input-box.lienzo-on { border-color: rgba(255,191,0,.55); box-shadow: 0 0 0 2px rgba(255,191,0,.11), 0 4px 24px rgba(0,0,0,.2); }
.lienzo-chip { height: 32px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; color: var(--guide-blue); background: var(--guide-yellow); border: 1px solid #e0a800; font-size: 13px; font-weight: 650; flex: 0 0 auto; margin-bottom: 1px; animation: chipPop .28s ease both; }


    .lienzo-chip .icon { width: 17px; height: 17px; }
    .prompt-input { flex: 1 1 auto; min-width: 0; height: 86px; max-height: 136px; resize: none; overflow-y: auto; border: 0; outline: 0; background: transparent; color: var(--text-main); font-size: 15.5px; line-height: 1.4; padding: 3px 1px; font-family: var(--font-family); scrollbar-color: #444 transparent; }
    .prompt-input::placeholder { color: var(--text-darker); }
    .model-button { border: 0; background: transparent; color: var(--text-muted); padding: 8px 4px; cursor: pointer; font-size: 13px; white-space: nowrap; flex: 0 0 auto; }
    .send-button { color: #171717; background: #fff; }
    .send-button:hover { color: #171717; background: #e9e9e9; }

    /* Plus menu */
    .plus-menu {
        position: absolute;
        display: none;
        flex-direction: column;
        z-index: 2200;
        width: calc(100% - 40px);
        max-width: 780px;
        padding: 10px;
        border-radius: 16px;
        background: #2f2f2f;
        border: 1px solid #444;
        box-shadow: 0 18px 42px rgba(0,0,0,.55);
        left: 20px;
        bottom: 112px;
        gap: 2px;
    }
    .plus-menu.show { display: flex; animation: menuIn .18s ease both; }
    .plus-menu-item { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 10px; cursor: pointer; color: #fff; font-size: 15px; border: 0; background: transparent; font-family: var(--font-family); text-align: left; }
    .plus-menu-item:hover, .plus-menu-item.simulation-target { background: #404040; }
    .plus-menu-item.lienzo-selected { color: var(--guide-blue); background: var(--guide-yellow); }
    .menu-text { display: flex; flex-direction: column; gap: 2px; }
    .menu-text-main { font-weight: 600; }
    .menu-text-sub { color: #aaa; font-size: 13px; font-weight: 400; }
    .menu-divider { height: 1px; background: #444; margin: 6px 4px; }

    /* Guide */
    .guide-overlay { position: absolute; inset: 0; background: transparent; backdrop-filter: none; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 1000; transition: all .4s ease; }
    .guide-card { position: absolute; top: 20px; right: 20px; width: 420px; max-height: calc(100% - 40px); background: var(--guide-cream); border: 2px solid var(--guide-blue); border-radius: 24px; padding: 24px; box-shadow: 0 15px 50px rgba(6,6,91,.26), 0 0 15px rgba(255,191,0,.18); display: flex; flex-direction: column; gap: 16px; overflow: hidden; pointer-events: auto; color: #444; }
    .paso-pill { display: inline-block; border: 1px solid var(--guide-yellow); background: var(--guide-yellow); color: var(--guide-blue); border-radius: 50px; padding: 4px 12px; font-size: 15px; width: fit-content; font-weight: 700; }
    .guide-title { font-size: 25px; line-height: 1.15; font-weight: 700; color: var(--guide-blue); padding-bottom: 4px; flex-shrink: 0; }
    .guide-content { line-height: 1.55; font-size: 17px; overflow-y: auto; flex-grow: 1; padding-right: 8px; color: #444; }
    .guide-content h3 { color: var(--guide-blue); font-size: 20px; margin: 0 0 12px; }
    .guide-content h4 { color: var(--guide-blue); font-size: 18px; margin: 18px 0 8px; }
    .guide-content p { margin: 0 0 12px; }
    .guide-content strong { color: var(--guide-blue); }
    .code-marker { display: inline-flex; align-items: center; justify-content: center; font-family: Consolas, monospace; color: var(--guide-blue); background: rgba(255,191,0,.35); border: 1px solid var(--guide-yellow); border-radius: 8px; padding: 2px 8px; font-weight: 800; margin: 4px 0 8px; }
    .prompt-box { background: #fff; border-left: 4px solid var(--guide-yellow); padding: 15px; border-radius: 0 12px 12px 0; font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.45; white-space: pre-wrap; margin: 10px 0 0; color: #333; overflow-wrap: anywhere; }
    .copy-btn { background: var(--guide-cream); color: var(--guide-blue); border: 1px solid var(--guide-yellow); padding: 6px 14px; border-radius: 50px; cursor: pointer; font-size: 14px; font-weight: 650; display: inline-flex; align-items: center; gap: 6px; margin: 10px 0 6px; font-family: var(--font-family); transition: .2s; }
    .copy-btn:hover { background: rgba(255,191,0,.15); }
    .guide-note { background: #fff; border: 1px solid #efdf9e; border-radius: 14px; padding: 12px 14px; color: var(--guide-blue); margin: 10px 0 12px; font-size: 16px; }
    .guide-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 15px; border-top: 1px solid #eee; flex-shrink: 0; gap: 8px; }
    .nav-btn { background: transparent; color: var(--guide-blue); border: 0; padding: 8px 16px; border-radius: 50px; cursor: pointer; font-size: 16px; font-weight: 700; transition: .2s; font-family: var(--font-family); white-space: nowrap; }
    .nav-btn:hover:not(:disabled) { background: rgba(255,191,0,.13); }
    .nav-btn:disabled { opacity: .55; cursor: not-allowed; }
    .nav-btn.primary { background: var(--guide-yellow); color: var(--guide-blue); }
    .nav-btn.primary:hover:not(:disabled) { background: #f2b700; }
    .step-indicator { color: #444; font-size: 15px; }

    /* Presentation artifact */
    .artifact-intro { margin-bottom: 14px !important; }
    .lienzo-artifact { width: 100%; overflow: hidden; border: 1px solid #3d3d3d; border-radius: 18px; background: #212121; box-shadow: 0 14px 35px rgba(0,0,0,.28); }
    .artifact-header { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid #343434; background: #262626; }
    .artifact-title-wrap { min-width: 0; flex: 1; }
    .artifact-title { font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artifact-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .artifact-actions { display: flex; gap: 7px; align-items: center; }
    .artifact-btn { border: 1px solid #4a4a4a; background: #303030; color: #e8e8e8; border-radius: 999px; padding: 7px 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; font-family: var(--font-family); }
    .artifact-btn:hover { background: #3a3a3a; }
    .slide-stage-wrap { position: relative; padding: 14px; }
    .slide-stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0c0c0c; border-radius: 12px; overflow: hidden; border: 1px solid #3a3a3a; display: grid; place-items: center; }
    .slide-stage img { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; object-position: center; background: #f5f5f5; display: block; }
    .slide-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.28); background: rgba(0,0,0,.42); color: #fff; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
    .slide-nav:hover { background: rgba(0,0,0,.68); }
    .slide-nav.prev { left: 10px; }
    .slide-nav.next { right: 10px; }
    .slide-counter { position: absolute; right: 12px; bottom: 10px; color: #fff; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 999px; font-size: 12px; }
    .thumbnail-strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 14px; scrollbar-color: var(--guide-yellow) transparent; }
    .slide-thumb { border: 2px solid transparent; background: #111; border-radius: 9px; padding: 0; width: 92px; aspect-ratio: 16 / 9; flex: 0 0 auto; overflow: hidden; cursor: pointer; position: relative; }
    .slide-thumb.active { border-color: var(--accent); }
    .slide-thumb img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; background: #111; }
    .thumb-number { position: absolute; left: 4px; top: 4px; min-width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.58); color: #fff; font-size: 11px; font-weight: 700; }
    .tone-menu { position: absolute; right: 22px; top: 8px; z-index: 8; display: none; flex-direction: column; gap: 2px; background: #2f2f2f; border: 1px solid #454545; border-radius: 12px; padding: 7px; box-shadow: 0 12px 28px rgba(0,0,0,.38); }
    .tone-menu.show { display: flex; }
    .tone-option { background: transparent; border: 0; color: #fff; padding: 8px 12px; border-radius: 8px; text-align: left; font-family: var(--font-family); cursor: pointer; }
    .tone-option:hover { background: #414141; }

    /* Toast and cursor */
    .toast { position: absolute; bottom: 106px; left: 50%; transform: translateX(-50%) translateY(14px); background: #101010; color: #fff; border: 1px solid #3b3b3b; border-radius: 999px; padding: 9px 14px; font-size: 14px; z-index: 2400; opacity: 0; pointer-events: none; transition: .22s ease; box-shadow: 0 12px 26px rgba(0,0,0,.35); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .sim-cursor { position: absolute; z-index: 2600; left: 0; top: 0; width: 26px; height: 26px; pointer-events: none; opacity: 0; transition-property: left, top, opacity, transform; transition-timing-function: cubic-bezier(.22,1,.36,1); filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
    .sim-cursor.visible { opacity: 1; }
    .sim-cursor.clicking { transform: scale(.82); }
    .sim-cursor svg { width: 26px; height: 26px; }
    .simulation-target { outline: 2px solid var(--accent) !important; outline-offset: 2px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dotPulse { 0%, 80%, 100% { transform: scale(.65); opacity: .42; } 40% { transform: scale(1); opacity: 1; } }
    @keyframes chipPop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes menuIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 1180px) {
        .sidebar { width: 220px; }
        .main-area.split-layout { padding-right: 400px; }
        .guide-card { width: 370px; padding: 20px; }
        .guide-title { font-size: 23px; }
        .guide-content { font-size: 16px; }
    }
    @media (max-width: 920px) {
        .sidebar { display: none; }
        .main-area.split-layout { padding-right: 0; }
        .guide-card { width: min(420px, calc(100vw - 28px)); right: 14px; top: 14px; max-height: 48%; }
        .chat-container { padding-top: 60px; }
        .input-wrapper { padding-bottom: 16px; }
    }
    @media (max-width: 640px) {
        .artifact-header { align-items: flex-start; flex-direction: column; }
        .artifact-actions { width: 100%; }
        .file-card { width: 102px; min-height: 90px; }
        .user-bubble { max-width: 95%; }
        .model-button { display: none; }
    }
</style>
</head>
<body>
<div class="chatgpt-simulator-wrapper" id="simulator">
    <svg class="svg-defs" aria-hidden="true">
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
        <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5Z"/><path d="M8 7h7M8 11h7"/></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
        <symbol id="i-apps" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
        <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
        <symbol id="i-lienzo" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>

À partir du document structuré « Defi_3_Contenu_de_chaque_diapositive_Asteria.docx » et des trois graphiques joints, générez la présentation en respectant strictement le Brand Book d’Asteria Global Solutions.

RÈGLES DE MISE EN PAGE
- Chaque H1 correspond au titre d’une diapositive.
- Les H2 et textes courts constituent le contenu.
- Une seule idée principale par diapositive.
- Maximum 40 mots de contenu narratif par diapositive.
- Préservez suffisamment d’espace blanc et évitez les listes verticales trop longues.

IDENTITÉ ASTERIA
- Utilisez le bleu nuit et le bleu stratégique pour structurer l’information.
- Réservez l’ambre aux accents, KPI et points d’attention.
- Utilisez une typographie sans sérif avec une hiérarchie très nette.
- Adoptez un français de France professionnel, naturel, factuel et orienté Comité de direction.

GRAPHIQUES
Intégrez aux diapositives prévues :
1. Graphique_1_Utilite_Decisionnelle_Asteria.png ;
2. Graphique_2_Sentiment_Veille_Asteria.png ;
3. Graphique_3_Charge_Consolidation_Asteria.png.

RIGUEUR
- Respectez fidèlement les données du document.
- N’inventez aucun chiffre, coût ou ROI.
- Distinguez les constats, les relations observées et les recommandations.
- Faites ressortir les décisions, risques et priorités pour le dispositif de veille et d’intelligence économique.

Générez et mettez en page les 10 diapositives.`;

    const prompt3 = `À partir de ce contenu, créez et mettez en page la présentation complète. Je veux obtenir les 10 diapositives finalisées et prêtes à être exportées au format PowerPoint.`;

    const response1 = `<p>Compris. J’ai analysé le Brand Book et la présentation de référence d’<strong>Asteria Global Solutions</strong>. J’ai intégré la hiérarchie visuelle, le ton factuel et orienté décision ainsi que les principes de lisibilité attendus pour une présentation destinée au Comité de direction.</p><p>Je suis prêt à recevoir le document structuré et les trois graphiques sur la performance du dispositif de veille et d’intelligence économique afin de créer les 10 diapositives.</p>`;

    const filesStep1 = [
        { type: 'PDF', visible: 'Présentation<br>de référence<br>Asteria', full: 'Presentation_Reference_Asteria_Defi_3.pdf' },
        { type: 'TXT', visible: '02_Brand_Book_<br>Asteria_<br>Synthetise', full: '02_Brand_Book_Asteria_Synthetise.txt' }
    ];

    const filesStep2 = [
        { type: 'DOCX', visible: 'Contenu des<br>10 diapositives', full: 'Defi_3_Contenu_de_chaque_diapositive_Asteria.docx' },
        { type: 'PNG', visible: 'Graphique 1<br>Utilité décisionnelle', full: 'Graphique_1_Utilite_Decisionnelle_Asteria.png' },
        { type: 'PNG', visible: 'Graphique 2<br>Sentiment', full: 'Graphique_2_Sentiment_Veille_Asteria.png' },
        { type: 'PNG', visible: 'Graphique 3<br>Consolidation manuelle', full: 'Graphique_3_Charge_Consolidation_Asteria.png' }
    ];

    const DOM = {
        simulator: document.getElementById('simulator'),
        mainArea: document.getElementById('mainArea'),
        chat: document.getElementById('chatContainer'),
        promptInput: document.getElementById('promptInput'),
        fileTray: document.getElementById('fileTray'),
        inputBox: document.getElementById('inputBox'),
        plusBtn: document.getElementById('plusBtn'),
        plusMenu: document.getElementById('plusMenu'),
        lienzoItem: document.getElementById('lienzoItem'),
        lienzoChip: document.getElementById('lienzoChip'),
        sendBtn: document.getElementById('sendBtn'),
        guideTitle: document.getElementById('guideTitle'),
        guideContent: document.getElementById('guideContent'),
        stepIndicator: document.getElementById('stepIndicator'),
        nextBtn: document.getElementById('nextBtn'),
        toast: document.getElementById('toast'),
        cursor: document.getElementById('cursor')
    };

    let stage = 0;
    let busy = false;
    let lienzoActive = false;
    let currentSlide = 0;

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    function fileCardsHTML(files, compact = false) {
        return files.map(file => `<div class="file-card${compact ? ' compact' : ''}" title="${escapeHtml(file.full)}"><div class="file-type">${file.type}</div><div class="file-name">${file.visible}</div></div>`).join('');
    }

    function setComposer(text, files) {
        DOM.promptInput.value = text;
        DOM.promptInput.style.height = text.length > 900 ? '126px' : '86px';
        DOM.fileTray.innerHTML = fileCardsHTML(files);
        DOM.fileTray.classList.toggle('hidden', files.length === 0);
    }

    function renderGuide(idx) {
        if (idx === 0) {
            stage = 0;
            DOM.guideTitle.textContent = 'Choisissez un outil et générez votre présentation';
            DOM.stepIndicator.textContent = '1 / 2';
            DOM.nextBtn.textContent = 'Activer Canvas et envoyer le prompt';
            DOM.nextBtn.disabled = false;
            DOM.guideContent.innerHTML = `
                <h3>Option 2 : ChatGPT (Canvas)</h3>
                <p>Si vous souhaitez contrôler précisément le contenu et la formulation de chaque diapositive, vous pouvez travailler dans <strong>Canvas</strong>.</p>
                <p><strong>Commencez par transmettre l’identité d’Asteria.</strong></p>
                <p>Activez Canvas dans ChatGPT, puis joignez le Brand Book synthétisé et la présentation de référence.</p>
                <p>Exécutez ensuite ce prompt :</p>
                <div class="code-marker">&lt;/&gt;</div>
                <div class="prompt-box" id="promptBox1">${escapeHtml(prompt1)}</div>
                <button class="copy-btn" data-copy="promptBox1"><svg class="icon" style="width:17px;height:17px"><use href="#i-copy"/></svg>Copier le prompt</button>
            `;
            setComposer(prompt1, filesStep1);
        } else {
            stage = 1;
            DOM.guideTitle.textContent = 'Mettez en page la présentation dans ChatGPT Canvas';
            DOM.stepIndicator.textContent = '2 / 2';
            DOM.nextBtn.textContent = 'Générer la présentation';
            DOM.nextBtn.disabled = false;
            DOM.guideContent.innerHTML = `
                <h3>Mise en page</h3>
                <p>Une fois l’identité d’Asteria assimilée, transmettez le document Word structuré avec les H1 et H2 créés à l’étape 6, ainsi que les trois graphiques sur la performance du dispositif de veille et d’intelligence économique.</p>
                <p>Exécutez le prompt suivant :</p>
                <div class="code-marker">&lt;/&gt;</div>
                <div class="prompt-box" id="promptBox2">${escapeHtml(prompt2)}</div>
                <button class="copy-btn" data-copy="promptBox2"><svg class="icon" style="width:17px;height:17px"><use href="#i-copy"/></svg>Copier le prompt</button>
                <div class="guide-note">Si ChatGPT génère uniquement le contenu dans Canvas et que vous souhaitez obtenir la présentation finalisée, utilisez cette dernière instruction :</div>
                <div class="code-marker">&lt;/&gt;</div>
                <div class="prompt-box" id="promptBox3">${escapeHtml(prompt3)}</div>
                <button class="copy-btn" data-copy="promptBox3"><svg class="icon" style="width:17px;height:17px"><use href="#i-copy"/></svg>Copier le prompt</button>
            `;
            setComposer(prompt2, filesStep2);
        }
        DOM.guideContent.scrollTop = 0;
        bindCopyButtons();
    }

    function renderFinalGuide() {
        DOM.guideTitle.textContent = 'Présentation générée';
        DOM.stepIndicator.textContent = '2 / 2';
        DOM.nextBtn.textContent = 'Présentation générée';
        DOM.nextBtn.disabled = true;
        DOM.guideContent.innerHTML = `
            <h3>Présentation générée</h3>
            <p>ChatGPT a créé la présentation ; vous pouvez la prévisualiser directement dans l’interface.</p>
            <p>Parcourez les 10 diapositives à l’aide des flèches ou des miniatures et vérifiez le contenu, les graphiques et la cohérence visuelle.</p>
            <div class="guide-note"><strong>Important :</strong> cet exercice simule la génération dans Canvas. Les fichiers joints et la présentation constituent une prévisualisation pédagogique.</div>
        `;
        DOM.promptInput.value = '';
        DOM.promptInput.style.height = '42px';
        DOM.fileTray.classList.add('hidden');
    }

    function bindCopyButtons() {
        DOM.guideContent.querySelectorAll('[data-copy]').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = document.getElementById(btn.dataset.copy);
                if (!target) return;
                copyText(target.innerText);
                showToast('Prompt copié');
            });
        });
    }

    function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.left = '-9999px';
        document.body.appendChild(area);
        area.select();
        try { document.execCommand('copy'); } catch (e) {}
        area.remove();
    }

    function chatgptAvatar() {
        return `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.28 9.82a5.98 5.98 0 0 0-.52-4.91 6.05 6.05 0 0 0-6.51-2.9A6.07 6.07 0 0 0 4.98 4.18a5.98 5.98 0 0 0-4 2.9 6.05 6.05 0 0 0 .74 7.1 5.98 5.98 0 0 0 .51 4.91 6.05 6.05 0 0 0 6.52 2.9 6.07 6.07 0 0 0 10.27-2.17 5.98 5.98 0 0 0 4-2.9 6.05 6.05 0 0 0-.74-7.1ZM8.75 6.56c1.31-1.13 3.23-1.33 4.77-.69l-4.14 7.16-.63-6.47ZM4.54 10.36a4.02 4.02 0 0 1 2.68-2.99l3.15 5.44-3.41 5.9a4.02 4.02 0 0 1-2.42-8.35Zm10.71 7.08c-1.31 1.13-3.23 1.33-4.77.69l4.15-7.16 1.62 6.47Zm5.21-3.8a4.02 4.02 0 0 1-2.68 2.99l-3.15-5.44 3.41-5.9a4.02 4.02 0 0 1 2.42 8.35Z"/></svg>`;
    }

    function addUserMessage(text, files = []) {
        const msg = document.createElement('div');
        msg.className = 'chat-message user';
        msg.innerHTML = `<div class="user-bubble">${files.length ? `<div class="message-files">${fileCardsHTML(files, true)}</div>` : ''}${escapeHtml(text)}</div>`;
        DOM.chat.appendChild(msg);
        scrollChat();
        return msg;
    }

    function addAssistantMessage(html) {
        const msg = document.createElement('div');
        msg.className = 'chat-message assistant';
        msg.innerHTML = `<div class="assistant-row"><div class="assistant-avatar">${chatgptAvatar()}</div><div class="message-content">${html}</div></div>`;
        DOM.chat.appendChild(msg);
        scrollChat();
        return msg;
    }

    function addThinking(label) {
        const msg = addAssistantMessage(`<div class="thinking-pill"><span>${label}</span><span class="thinking-dots"><i></i><i></i><i></i></span></div>`);
        msg.dataset.thinking = 'true';
        return msg;
    }

    function scrollChat() {
        requestAnimationFrame(() => { DOM.chat.scrollTop = DOM.chat.scrollHeight; });
    }

    function activateCanvas() {
        lienzoActive = true;
        DOM.lienzoChip.classList.remove('hidden');
        DOM.inputBox.classList.add('lienzo-on');
        DOM.lienzoItem.classList.add('lienzo-selected');
        showToast('Canvas activé');
    }

    function closeMenus() {
        DOM.plusMenu.classList.remove('show');
        DOM.plusBtn.classList.remove('active');
        DOM.lienzoItem.classList.remove('simulation-target');
    }

    DOM.plusBtn.addEventListener('click', e => {
        e.stopPropagation();
        const shouldShow = !DOM.plusMenu.classList.contains('show');
        closeMenus();
        DOM.plusMenu.classList.toggle('show', shouldShow);
        DOM.plusBtn.classList.toggle('active', shouldShow);
    });
    DOM.lienzoItem.addEventListener('click', e => { e.stopPropagation(); activateCanvas(); closeMenus(); });
    document.addEventListener('click', e => { if (!e.target.closest('.plus-menu') && !e.target.closest('#plusBtn')) closeMenus(); });

    function createPresentationHTML() {
        const thumbs = slideImages.map((src, idx) => `<button class="slide-thumb${idx === 0 ? ' active' : ''}" data-slide="${idx}" aria-label="Voir la diapositive ${idx + 1}"><img src="${src}" alt="Miniature de la diapositive ${idx + 1}"><span class="thumb-number">${idx + 1}</span></button>`).join('');
        return `<p class="artifact-intro">J’ai créé et mis en page la présentation dans Canvas en respectant le Brand Book de Asteria Global Solutions. Voici la prévisualisation complète des 10 diapositives.</p>
            <div class="lienzo-artifact" id="presentationArtifact">
                <div class="artifact-header">
                    <svg class="icon" style="color:#19c37d"><use href="#i-presentation"/></svg>
                    <div class="artifact-title-wrap"><div class="artifact-title">Asteria Global Solutions · Performance du dispositif de veille et d’intelligence économique</div><div class="artifact-meta">Canvas · Présentation · 10 diapositives</div></div>
                    <div class="artifact-actions"><button class="artifact-btn" id="toneBtn"><svg class="icon" style="width:16px;height:16px"><use href="#i-tone"/></svg><span>Ajuster le ton</span></button></div>
                </div>
                <div class="slide-stage-wrap">
                    <div class="tone-menu" id="toneMenu"><button class="tone-option">Plus direct</button><button class="tone-option">Plus conciso</button><button class="tone-option">Plus chaleureux</button></div>
                    <div class="slide-stage"><img id="activeSlide" src="${slideImages[0]}" alt="Diapositive 1 de la présentation"><button class="slide-nav prev" id="prevSlide" aria-label="Diapositive précédente"><svg class="icon"><use href="#i-left"/></svg></button><button class="slide-nav next" id="nextSlide" aria-label="Diapositive suivante"><svg class="icon"><use href="#i-right"/></svg></button><span class="slide-counter" id="slideCounter">1 / ${slideImages.length}</span></div>
                </div>
                <div class="thumbnail-strip" id="thumbnailStrip">${thumbs}</div>
            </div>`;
    }

    function bindPresentationControls() {
        const artifact = document.getElementById('presentationArtifact');
        if (!artifact) return;
        const active = document.getElementById('activeSlide');
        const counter = document.getElementById('slideCounter');
        const strip = document.getElementById('thumbnailStrip');
        const toneBtn = document.getElementById('toneBtn');
        const toneMenu = document.getElementById('toneMenu');

        const showSlide = idx => {
            currentSlide = (idx + slideImages.length) % slideImages.length;
            active.src = slideImages[currentSlide];
            active.alt = `Diapositive ${currentSlide + 1} de la présentation`;
            counter.textContent = `${currentSlide + 1} / ${slideImages.length}`;
            strip.querySelectorAll('.slide-thumb').forEach((el, i) => el.classList.toggle('active', i === currentSlide));
            const selected = strip.querySelector(`[data-slide="${currentSlide}"]`);
            if (selected) selected.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        };

        document.getElementById('prevSlide').addEventListener('click', () => showSlide(currentSlide - 1));
        document.getElementById('nextSlide').addEventListener('click', () => showSlide(currentSlide + 1));
        strip.addEventListener('click', e => { const thumb = e.target.closest('[data-slide]'); if (thumb) showSlide(Number(thumb.dataset.slide)); });
        toneBtn.addEventListener('click', e => { e.stopPropagation(); toneMenu.classList.toggle('show'); });
        toneMenu.addEventListener('click', e => { const option = e.target.closest('.tone-option'); if (option) { showToast(`Ton ajusté: ${option.textContent}`); toneMenu.classList.remove('show'); } });
        document.addEventListener('click', e => { if (!e.target.closest('#toneMenu') && !e.target.closest('#toneBtn')) toneMenu.classList.remove('show'); });
    }

    function showToast(text) {
        DOM.toast.textContent = text;
        DOM.toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => DOM.toast.classList.remove('show'), 1600);
    }

    function targetPosition(el) {
        const wrapper = DOM.simulator.getBoundingClientRect();
        const rect = el.getBoundingClientRect();
        return { x: rect.left - wrapper.left + rect.width / 2 - 4, y: rect.top - wrapper.top + rect.height / 2 - 2 };
    }

    function setCursorAt(el) {
        const { x, y } = targetPosition(el);
        DOM.cursor.style.transitionDuration = '0ms';
        DOM.cursor.style.left = `${x}px`;
        DOM.cursor.style.top = `${y}px`;
        DOM.cursor.classList.add('visible');
    }

    async function moveCursorTo(el, duration = 620) {
        const { x, y } = targetPosition(el);
        DOM.cursor.style.transitionDuration = `${duration}ms`;
        DOM.cursor.classList.add('visible');
        requestAnimationFrame(() => {
            DOM.cursor.style.left = `${x}px`;
            DOM.cursor.style.top = `${y}px`;
        });
        await sleep(duration + 35);
    }

    async function cursorClick() {
        DOM.cursor.classList.add('clicking');
        await sleep(170);
        DOM.cursor.classList.remove('clicking');
        await sleep(90);
    }

    async function runFirstFlow() {
        if (busy) return;
        busy = true;
        DOM.nextBtn.disabled = true;
        DOM.nextBtn.textContent = 'Activation de Canvas…';
        setCursorAt(DOM.nextBtn);
        await sleep(220);
        await moveCursorTo(DOM.plusBtn, 660);
        await cursorClick();
        DOM.plusMenu.classList.add('show');
        DOM.plusBtn.classList.add('active');
        await sleep(280);
        DOM.lienzoItem.classList.add('simulation-target');
        await moveCursorTo(DOM.lienzoItem, 560);
        await cursorClick();
        activateCanvas();
        closeMenus();
        await sleep(360);
        await moveCursorTo(DOM.sendBtn, 650);
        await cursorClick();

        const text = DOM.promptInput.value;
        DOM.promptInput.value = '';
        DOM.fileTray.classList.add('hidden');
        addUserMessage(text, filesStep1);
        const thinking = addThinking('ChatGPT assimile votre Brand Book');
        await sleep(1000);
        thinking.remove();
        addAssistantMessage(response1);
        await sleep(260);
        DOM.cursor.classList.remove('visible');
        renderGuide(1);
        busy = false;
    }

    async function runSecondFlow() {
        if (busy) return;
        busy = true;
        DOM.nextBtn.disabled = true;
        DOM.nextBtn.textContent = 'Génération de la présentation...';
        setCursorAt(DOM.nextBtn);
        await sleep(210);
        await moveCursorTo(DOM.sendBtn, 640);
        await cursorClick();

        const text = DOM.promptInput.value;
        DOM.promptInput.value = '';
        DOM.fileTray.classList.add('hidden');
        addUserMessage(text, filesStep2);
        const thinking = addThinking('ChatGPT crée votre présentation dans Canvas');
        await sleep(2000);
        thinking.remove();
        addAssistantMessage(createPresentationHTML());
        bindPresentationControls();
        const activeSlide = document.getElementById('activeSlide');
        if (activeSlide && !activeSlide.complete) activeSlide.addEventListener('load', scrollChat, { once: true });
        await sleep(250);
        DOM.cursor.classList.remove('visible');
        renderFinalGuide();
        scrollChat();
        setTimeout(scrollChat, 420);
        busy = false;
    }

    DOM.nextBtn.addEventListener('click', () => {
        if (stage === 0) runFirstFlow();
        else if (stage === 1) runSecondFlow();
    });

    renderGuide(0);
});
</script>
</body>
</html>
